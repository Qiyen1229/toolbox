<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="複利計算器 — 存股定期定額、ETF 與長期理財試算，見證時間與複利滾雪球的威力。Qiyen Toolbox。">
  <title>複利計算器 (Compound Interest) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">複利計算器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">複利與定期定額計算器</span>
            <span class="tool-header__title-en">Compound Interest Calculator</span>
          </div>
        </h1>
        <p class="tool-header__description">存股、ETF 與退休金定期定額試算，感受「世界第八大奇蹟」複利帶來的資產滾動效應。</p>
      </header>

      <!-- 輸入區塊 -->
      <div class="tool-section">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-md);">
          
          <div class="form-group">
            <label class="form-label" for="init-capital">初始投入本金 (NT$)：</label>
            <input type="number" class="form-input" id="init-capital" value="100000" min="0" step="10000" style="font-size: 1.125rem; font-weight: 700;">
          </div>

          <div class="form-group">
            <label class="form-label" for="monthly-deposit">每月定期定額投入 (NT$)：</label>
            <input type="number" class="form-input" id="monthly-deposit" value="10000" min="0" step="1000" style="font-size: 1.125rem; font-weight: 700;">
          </div>

          <div class="form-group">
            <label class="form-label" for="invest-years">投資年限 (年)：</label>
            <input type="number" class="form-input" id="invest-years" value="20" min="1" max="60" step="1">
          </div>

          <div class="form-group">
            <label class="form-label" for="annual-return">預估年化報酬率 (%)：</label>
            <input type="number" class="form-input" id="annual-return" value="8" min="0" max="100" step="0.5">
          </div>

        </div>
      </div>

      <!-- 計算結果結算卡片 -->
      <div class="tool-section">
        <div style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(99, 102, 241, 0.08) 100%); border: 2px solid var(--color-success); border-radius: var(--radius-lg); padding: var(--space-lg);">
          
          <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--space-md); margin-bottom: var(--space-lg);">
            <div>
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary); text-transform: uppercase;">最終資產總值 (Total Value)</span>
              <div id="final-balance" style="font-size: 2.5rem; font-weight: 800; color: var(--color-success); line-height: 1.2;">
                NT$ 0
              </div>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">複利累積淨獲利</span>
              <div id="total-profit" style="font-size: 1.5rem; font-weight: 700; color: var(--color-accent);">
                NT$ 0 (+0%)
              </div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); border-top: 1px dashed var(--color-border); padding-top: var(--space-md); font-size: 0.875rem;">
            <div>
              <span style="color: var(--color-text-secondary);">自掏腰包累積本金：</span>
              <div id="total-principal" style="font-weight: 700;">NT$ 0</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">總投入月數：</span>
              <div id="total-months" style="font-weight: 700;">240 個月</div>
            </div>
          </div>

          <!-- 視覺化條狀比對 -->
          <div style="margin-top: var(--space-lg);">
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; color: var(--color-text-secondary);">
              <span>本金佔比 <strong id="bar-principal-pct">0%</strong></span>
              <span>獲利佔比 <strong id="bar-profit-pct">0%</strong></span>
            </div>
            <div style="height: 14px; width: 100%; background: var(--color-border); border-radius: 7px; overflow: hidden; display: flex;">
              <div id="bar-principal" style="background: var(--color-text-tertiary); width: 40%; transition: width 0.3s ease;"></div>
              <div id="bar-profit" style="background: var(--color-success); width: 60%; transition: width 0.3s ease;"></div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
