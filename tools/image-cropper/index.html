<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="圖片裁切器 — 本地互動式圖片自由裁切與固定比例（1:1、4:3、16:9、圓形頭像）調整，100% 瀏覽器本地運算即時下載。">
  <title>圖片裁切器 (Image Cropper) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">圖片裁切器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
              <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">圖片裁切器</span>
            <span class="tool-header__title-en">Image Cropper</span>
          </div>
        </h1>
        <p class="tool-header__description">互動式圖片裁切工具，支援 1:1 正方形、圓形頭像、16:9 與自由比例裁切，純前端極速運算。</p>
      </header>

      <!-- 上傳拖曳區 -->
      <div class="tool-section">
        <div class="file-drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="image/*" style="display: none;">
          <div class="file-drop-zone__icon">✂️</div>
          <div class="file-drop-zone__text">點擊選擇圖片，或直接拖曳圖片至此處</div>
          <div class="file-drop-zone__hint">支援 JPG、PNG、WEBP 格式</div>
        </div>
      </div>

      <!-- 裁切控制與工作區 -->
      <div class="tool-section" id="cropper-section" style="display: none;">
        <div class="tool-section__header">
          <div class="tool-section__title">裁切比例設定</div>
          <!-- 比例按鈕組 -->
          <div style="display: flex; gap: var(--space-xs); flex-wrap: wrap;">
            <button class="btn btn--sm btn--primary btn-ratio" data-ratio="free">自由 (Free)</button>
            <button class="btn btn--sm btn--secondary btn-ratio" data-ratio="1:1">1:1 (正方形)</button>
            <button class="btn btn--sm btn--secondary btn-ratio" data-ratio="4:3">4:3</button>
            <button class="btn btn--sm btn--secondary btn-ratio" data-ratio="16:9">16:9</button>
            <button class="btn btn--sm btn--secondary btn-ratio" data-ratio="circle">⭕ 圓形頭像</button>
          </div>
        </div>

        <div class="tool-split" style="margin-top: var(--space-md); align-items: start;">
          <!-- 互動畫布 -->
          <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); text-align: center;">
            <div style="font-size: 0.8125rem; color: var(--color-text-tertiary); margin-bottom: 8px;">在下方畫布上拖曳滑鼠以調整裁切範圍</div>
            <div style="position: relative; display: inline-block; max-width: 100%; overflow: hidden; border-radius: var(--radius-sm); user-select: none;">
              <canvas id="crop-canvas" style="max-width: 100%; max-height: 480px; display: block; cursor: crosshair;"></canvas>
            </div>
          </div>

          <!-- 即時裁切預覽 -->
          <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); text-align: center; display: flex; flex-direction: column; align-items: center;">
            <div style="font-weight: 600; margin-bottom: var(--space-sm); color: var(--color-accent);">裁切預覽</div>
            <div id="preview-box" style="width: 220px; height: 220px; background: var(--color-bg); border: 1px dashed var(--color-border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: var(--space-md);">
              <canvas id="result-canvas" style="max-width: 100%; max-height: 100%; object-fit: contain;"></canvas>
            </div>
            <div id="crop-dim-badge" style="font-size: 0.8125rem; color: var(--color-text-secondary); margin-bottom: var(--space-md);">尺寸：-- × -- px</div>

            <button class="btn btn--primary" id="btn-download-crop" type="button" style="width: 100%;">
              下載裁切後的圖片
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
