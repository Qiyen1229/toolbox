<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DNS Propagation Checker — 檢查網域在全球各大公用 DNS 伺服器（Google、Cloudflare、Quad9、AdGuard 等）的解析傳播狀態。Qiyen Toolbox。">
  <title>DNS 傳播檢查 (DNS Propagation Checker) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">DNS 傳播檢查</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">DNS 傳播檢查</span>
            <span class="tool-header__title-en">DNS Propagation Checker</span>
          </div>
        </h1>
        <p class="tool-header__description">平行測試全球多個主要 DNS 節點的解析結果與延遲，驗證網域更動是否已在全球廣泛傳播生效。</p>
      </header>

      <!-- 輸入區塊 -->
      <div class="tool-section">
        <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap;">
          <input type="text" class="form-input" id="domain-input" placeholder="輸入網域名稱，例如：github.com" value="github.com" style="flex: 1; min-width: 240px;">
          
          <select class="form-select" id="record-type" style="width: 130px;">
            <option value="A" selected>A (IPv4)</option>
            <option value="AAAA">AAAA (IPv6)</option>
            <option value="CNAME">CNAME</option>
            <option value="MX">MX</option>
            <option value="TXT">TXT</option>
          </select>

          <button class="btn btn--primary" id="btn-check" type="button" style="min-width: 140px;">
            檢查全球傳播
          </button>
        </div>
      </div>

      <!-- 節點檢查結果列表 -->
      <div class="tool-section" id="nodes-section">
        <div class="tool-section__header">
          <div class="tool-section__title" id="status-title">DNS 節點檢查結果</div>
          <div id="summary-badge" style="font-size: 0.8125rem; font-weight: 700; color: var(--color-accent);">準備就緒</div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-md); margin-top: var(--space-md);" id="nodes-grid">
          <!-- 動態渲染各伺服器卡片 -->
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
