<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Color Picker & Palette — 專業開發者調色盤與取色器，支援色輪挑選、HEX/RGB/HSL 雙向換算、調色盤產生與 WCAG 無障礙對比度檢查。Qiyen Toolbox。">
  <title>專業取色調色盤 (Color Picker & Palette) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">專業取色調色盤</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/>
              <path d="m5 2 5 5"/>
              <circle cx="19" cy="19" r="2"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">專業取色調色盤</span>
            <span class="tool-header__title-en">Color Picker & Palette</span>
          </div>
        </h1>
        <p class="tool-header__description">高階色彩分析工具，支援即時取色、多格式數值轉換、互補調色盤生成與 WCAG 對比度校驗。</p>
      </header>

      <!-- 色彩檢視與取色主區 -->
      <div class="tool-section" style="display: flex; gap: var(--space-xl); flex-wrap: wrap; align-items: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-sm);">
          <div id="color-box" style="
            width: 140px;
            height: 140px;
            border-radius: var(--radius-lg);
            background: #3b82f6;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.2);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
          "></div>
          <input type="color" id="native-picker" value="#3b82f6" style="width: 140px; height: 36px; border: none; cursor: pointer; border-radius: var(--radius-sm); background: transparent;">
        </div>

        <div style="flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: var(--space-sm);">
          <div style="display: flex; gap: var(--space-sm); align-items: center;">
            <span style="width: 70px; font-weight: 700; font-family: var(--font-mono, monospace);">HEX</span>
            <input type="text" class="form-input" id="val-hex" value="#3B82F6" style="flex: 1; font-family: var(--font-mono, monospace);">
            <button class="btn btn--sm btn--secondary btn-copy-val" data-target="val-hex">複製</button>
          </div>
          <div style="display: flex; gap: var(--space-sm); align-items: center;">
            <span style="width: 70px; font-weight: 700; font-family: var(--font-mono, monospace);">RGB</span>
            <input type="text" class="form-input" id="val-rgb" value="rgb(59, 130, 246)" style="flex: 1; font-family: var(--font-mono, monospace);">
            <button class="btn btn--sm btn--secondary btn-copy-val" data-target="val-rgb">複製</button>
          </div>
          <div style="display: flex; gap: var(--space-sm); align-items: center;">
            <span style="width: 70px; font-weight: 700; font-family: var(--font-mono, monospace);">HSL</span>
            <input type="text" class="form-input" id="val-hsl" value="hsl(217, 91%, 60%)" style="flex: 1; font-family: var(--font-mono, monospace);">
            <button class="btn btn--sm btn--secondary btn-copy-val" data-target="val-hsl">複製</button>
          </div>
        </div>
      </div>

      <!-- 調色盤生成區 -->
      <div class="tool-section" style="margin-top: var(--space-lg);">
        <div class="tool-section__title" style="margin-bottom: var(--space-md);">🎨 自動推導五色調色盤 (Color Palette)</div>
        <div id="palette-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--space-md);"></div>
      </div>

      <!-- WCAG 無障礙對比度檢查 -->
      <div class="tool-section" style="margin-top: var(--space-lg);">
        <div class="tool-section__title" style="margin-bottom: var(--space-sm);">♿ WCAG 2.1 對比度檢測 (Accessibility Contrast)</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-lg); margin-top: var(--space-md);">
          <!-- 白底對比 -->
          <div id="contrast-white" style="padding: var(--space-lg); border-radius: var(--radius-md); background: #ffffff; color: #000000; border: 1px solid var(--color-border); text-align: center;">
            <div style="font-weight: 700; font-size: 1.125rem;">白色背景對比度</div>
            <div class="contrast-ratio" style="font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono, monospace); margin: 6px 0;">-</div>
            <div class="contrast-badge" style="font-weight: 700; font-size: 0.8125rem;">-</div>
          </div>
          <!-- 黑底對比 -->
          <div id="contrast-black" style="padding: var(--space-lg); border-radius: var(--radius-md); background: #0f172a; color: #ffffff; border: 1px solid var(--color-border); text-align: center;">
            <div style="font-weight: 700; font-size: 1.125rem;">深色背景對比度</div>
            <div class="contrast-ratio" style="font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono, monospace); margin: 6px 0;">-</div>
            <div class="contrast-badge" style="font-weight: 700; font-size: 0.8125rem;">-</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
