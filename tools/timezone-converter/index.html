<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="跨國時區轉換器 — 台灣、日本、美東、美西、英國即時互動時區比對與跨國會議時間挑選。Qiyen Toolbox。">
  <title>時區轉換器 (Timezone Converter) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">時區轉換器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">跨國時區轉換器</span>
            <span class="tool-header__title-en">Timezone Converter</span>
          </div>
        </h1>
        <p class="tool-header__description">台北 ↔ 日本 ↔ 美國 ↔ 歐洲時間聯動切換，拖曳時間軸快速找出跨國通話與線上會議的最佳時段。</p>
      </header>

      <!-- 控制軸區塊 -->
      <div class="tool-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
          <div>
            <label class="form-label" style="margin: 0;">基準日期與台北時間：</label>
            <span id="base-datetime-label" style="font-weight: 700; color: var(--color-accent); font-size: 1.125rem;">2026-09-22 14:00</span>
          </div>
          <button class="btn btn--sm btn--secondary" id="btn-now">重設為現在時間</button>
        </div>

        <!-- 時間滑桿 0~23 -->
        <div>
          <input type="range" id="hour-slider" min="0" max="23" value="14" step="1" style="width: 100%; cursor: pointer; accent-color: var(--color-accent);">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--color-text-secondary); margin-top: 4px;">
            <span>00:00 (子夜)</span>
            <span>06:00</span>
            <span>12:00 (正午)</span>
            <span>18:00 (下班)</span>
            <span>23:00</span>
          </div>
        </div>
      </div>

      <!-- 各時區城市卡片清單 -->
      <div class="tool-section">
        <div id="city-cards-list" style="display: flex; flex-direction: column; gap: var(--space-sm);">
          <!-- 動態生成各城市時間列 -->
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
