<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="常用單位換算 — 長度、重量、溫度、面積、容量、數位儲存全方位即時換算工具，支援坪、台斤等台灣在地單位。Qiyen Toolbox 線上工具。">
  <title>常用單位換算 — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">常用單位換算</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <path d="M3.29 3.29 5 5"/>
              <path d="M7 3.29 8.5 5"/>
              <path d="M3.29 7 5 8.5"/>
              <path d="M3 21l9-9"/>
              <path d="M12.71 12.71 11 11"/>
              <path d="M3.29 11 5 12.5"/>
              <path d="M11 3.29 12.5 5"/>
            </svg>
          </div>
          常用單位換算
        </h1>
        <p class="tool-header__description">長度、重量、溫度、面積、容量與儲存容量雙向即時換算，輸入任意一項自動同步所有數值。</p>
      </header>

      <!-- 類別頁籤 -->
      <div style="display: flex; gap: var(--space-xs); overflow-x: auto; padding-bottom: var(--space-xs); margin-bottom: var(--space-lg);" id="unit-tabs">
        <button class="btn btn--sm btn--primary tab-btn" data-category="length">📏 長度</button>
        <button class="btn btn--sm btn--ghost tab-btn" data-category="weight">⚖️ 重量</button>
        <button class="btn btn--sm btn--ghost tab-btn" data-category="temperature">🌡️ 溫度</button>
        <button class="btn btn--sm btn--ghost tab-btn" data-category="area">📐 面積</button>
        <button class="btn btn--sm btn--ghost tab-btn" data-category="volume">🧪 容量</button>
        <button class="btn btn--sm btn--ghost tab-btn" data-category="data">💾 儲存</button>
      </div>

      <!-- 換算區塊 -->
      <div class="tool-section">
        <div class="tool-section__header">
          <div class="tool-section__title" id="category-title">長度單位換算</div>
          <button class="btn btn--sm btn--ghost" id="btn-reset" type="button">重設數值</button>
        </div>

        <div id="unit-fields" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-md); margin-top: var(--space-md);">
          <!-- 由 script.js 動態渲染各單位輸入框 -->
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
