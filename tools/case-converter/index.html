<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Case Converter — 英文大小寫轉換工具，支援 UPPERCASE、lowercase、Title Case、camelCase、snake_case、kebab-case、CONSTANT_CASE 等多種格式。">
  <title>Case Converter — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">Case Converter</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7"/>
              <line x1="9" y1="20" x2="15" y2="20"/>
              <line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
          </div>
          Case Converter
        </h1>
        <p class="tool-header__description">英文字串大小寫與程式命名格式快速轉換，支援駝峰、蛇形、常數等多種模式。</p>
      </header>

      <!-- 轉換模式按鈕區 -->
      <div class="tool-section">
        <div class="tool-section__title">選擇轉換格式</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--space-sm);">
          <button class="btn btn--secondary btn-case-mode" data-mode="upper">UPPERCASE</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="lower">lowercase</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="title">Title Case (標題首字大寫)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="sentence">Sentence case (句首大寫)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="camel">camelCase (小駝峰)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="pascal">PascalCase (大駝峰)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="snake">snake_case (蛇形)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="kebab">kebab-case (烤肉串)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="constant">CONSTANT_CASE (常數)</button>
          <button class="btn btn--secondary btn-case-mode" data-mode="invert">tOGGLE cASE (反轉大小寫)</button>
        </div>
      </div>

      <!-- 雙欄版面：輸入與輸出 -->
      <div class="tool-split">
        <!-- 輸入 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title">原始文字 (Input)</div>
            <button class="btn btn--sm btn--ghost" id="btn-sample" type="button">載入範例</button>
          </div>
          <textarea
            class="form-textarea"
            id="case-input"
            placeholder="請在此輸入要轉換的文字…"
            rows="8"
          ></textarea>
          <div style="font-size: 0.8125rem; color: var(--color-text-tertiary); margin-top: var(--space-xs);" id="input-stats">
            字元數: 0 · 單字數: 0
          </div>
        </div>

        <!-- 輸出 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title">轉換結果 (Output)</div>
            <button class="btn btn--sm btn--secondary" id="btn-copy" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              複製結果
            </button>
          </div>
          <textarea
            class="form-textarea"
            id="case-output"
            placeholder="點擊上方任意格式按鈕進行轉換…"
            rows="8"
            readonly
          ></textarea>
          <div style="font-size: 0.8125rem; color: var(--color-text-tertiary); margin-top: var(--space-xs);" id="output-stats">
            字元數: 0
          </div>
        </div>
      </div>

      <!-- 底部動作按鈕 -->
      <div class="tool-actions" style="margin-top: var(--space-lg);">
        <button class="btn btn--secondary" id="btn-replace-input" type="button">
          以轉換結果替換輸入
        </button>
        <button class="btn btn--ghost" id="btn-clear" type="button">
          清除內容
        </button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
