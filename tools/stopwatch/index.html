<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stopwatch — 高精準數位碼表計時器，支援分圈計次 (Lap)、最快最慢圈標示與快捷鍵操作。Qiyen Toolbox。">
  <title>Stopwatch — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">Stopwatch</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4l2 2"/>
              <path d="M10 2h4"/>
              <path d="M12 2v3"/>
              <path d="M19.4 6.6l1-1"/>
            </svg>
          </div>
          Stopwatch
        </h1>
        <p class="tool-header__description">高精準度碼表，支援單圈記時 (Lap)、最快/最慢圈高亮顯示與鍵盤快速鍵。</p>
      </header>

      <!-- 碼表主顯示區 -->
      <div class="tool-section" style="text-align: center; padding: var(--space-2xl) var(--space-md);">
        <div style="
          font-family: var(--font-mono, monospace);
          font-size: clamp(2.5rem, 8vw, 4.5rem);
          font-weight: 800;
          letter-spacing: 0.05em;
          color: var(--color-text-primary);
          margin-bottom: var(--space-xl);
          user-select: none;
        " id="display-time">
          00:00:00<span style="font-size: 0.55em; color: var(--color-accent); margin-left: 4px;">.00</span>
        </div>

        <!-- 主控制按鈕 -->
        <div style="display: flex; justify-content: center; gap: var(--space-md); flex-wrap: wrap;">
          <button class="btn btn--lg btn--primary" id="btn-start" style="min-width: 130px; font-weight: 700;">
            開始 (Start)
          </button>
          <button class="btn btn--lg btn--secondary" id="btn-lap" disabled style="min-width: 120px;">
            計次 (Lap)
          </button>
          <button class="btn btn--lg btn--ghost" id="btn-reset" disabled style="min-width: 110px;">
            重設 (Reset)
          </button>
        </div>

        <!-- 快捷鍵提示 -->
        <div style="margin-top: var(--space-lg); font-size: 0.8125rem; color: var(--color-text-tertiary);">
          快速鍵：<kbd style="padding: 2px 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 4px;">Space</kbd> 開始/暫停 · 
          <kbd style="padding: 2px 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 4px;">L</kbd> 計次 · 
          <kbd style="padding: 2px 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 4px;">R</kbd> 重設
        </div>
      </div>

      <!-- 計次紀錄清單 -->
      <div class="tool-section" id="lap-section" style="display: none;">
        <div class="tool-section__header">
          <div class="tool-section__title">計次紀錄 (Laps)</div>
          <button class="btn btn--sm btn--secondary" id="btn-copy-laps" type="button">複製所有紀錄</button>
        </div>

        <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; margin-top: var(--space-md);">
          <div style="display: grid; grid-template-columns: 80px 1fr 1fr; padding: 10px 16px; background: var(--color-bg); font-weight: 600; font-size: 0.8125rem; color: var(--color-text-secondary); border-bottom: 1px solid var(--color-border);">
            <span>圈數</span>
            <span>單圈時間 (Split)</span>
            <span>累計時間 (Total)</span>
          </div>
          <div id="lap-list" style="max-height: 320px; overflow-y: auto;">
            <!-- 由 script.js 動態渲染 -->
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
