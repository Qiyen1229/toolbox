<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="兩日期相差計算器 — 快速精確計算兩個日期間隔的天數、週數、月數與扣除週末的工作天數。Qiyen Toolbox。">
  <title>日期差計算器 (Date Difference) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">日期差計算器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">兩日期相差計算器</span>
            <span class="tool-header__title-en">Date Difference Calculator</span>
          </div>
        </h1>
        <p class="tool-header__description">計算兩個日期間相差的天數、週數、月數與排除週末的上班工作天。</p>
      </header>

      <!-- 輸入區塊 -->
      <div class="tool-section">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-md);">
          
          <div class="form-group">
            <label class="form-label" for="start-date">起始日期：</label>
            <input type="date" class="form-input" id="start-date">
            <div style="display: flex; gap: 6px; margin-top: 6px;">
              <button class="btn btn--xs btn--ghost btn-start-preset" data-type="today">今天</button>
              <button class="btn btn--xs btn--ghost btn-start-preset" data-type="year-start">今年第一天</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="end-date">結束日期：</label>
            <input type="date" class="form-input" id="end-date">
            <div style="display: flex; gap: 6px; margin-top: 6px;">
              <button class="btn btn--xs btn--ghost btn-end-preset" data-type="today">今天</button>
              <button class="btn btn--xs btn--ghost btn-end-preset" data-type="year-end">今年底</button>
              <button class="btn btn--xs btn--ghost btn-end-preset" data-type="plus-100">+100天</button>
            </div>
          </div>

        </div>

        <div class="form-group" style="margin-top: var(--space-md);">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="include-end-day" checked>
            <span style="font-size: 0.875rem;">包含結束日期當天（算頭也算尾）</span>
          </label>
        </div>
      </div>

      <!-- 計算結果卡片 -->
      <div class="tool-section">
        <div style="background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(168,85,247,0.08) 100%); border: 2px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-lg);">
          
          <div style="margin-bottom: var(--space-lg);">
            <span style="font-size: 0.8125rem; color: var(--color-text-secondary); text-transform: uppercase;">相差總天數</span>
            <div id="diff-days-large" style="font-size: 2.75rem; font-weight: 800; color: var(--color-accent); line-height: 1.2;">
              0 天
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); border-top: 1px dashed var(--color-border); padding-top: var(--space-md); font-size: 0.875rem;">
            <div>
              <span style="color: var(--color-text-secondary);">年 / 月 / 日 格式：</span>
              <div id="diff-ymd" style="font-weight: 700; margin-top: 2px;">0 個月 0 天</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">週數折合：</span>
              <div id="diff-weeks" style="font-weight: 700; margin-top: 2px;">0 週 0 天</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">工作天（排除六日）：</span>
              <div id="diff-workdays" style="font-weight: 700; margin-top: 2px; color: var(--color-success);">0 工作天</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
