<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Image Compressor — 本地瀏覽器圖片壓縮工具，支援 JPG、PNG、WEBP，自訂品質與尺寸，100% 隱私無虞不上傳伺服器。">
  <title>Image Compressor — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">Image Compressor</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
              <polyline points="12 12 12 21"/>
              <polyline points="8 17 12 21 16 17"/>
            </svg>
          </div>
          Image Compressor
        </h1>
        <p class="tool-header__description">本地瀏覽器極速壓縮圖片，自訂輸出品質與格式，大幅縮小檔案體積且不上傳伺服器。</p>
      </header>

      <!-- 檔案拖曳上傳區 -->
      <div class="tool-section" id="upload-section">
        <div class="file-drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" style="display: none;">
          <div class="file-drop-zone__icon">🖼️</div>
          <div class="file-drop-zone__text">點擊選擇圖片，或直接拖曳圖片至此處</div>
          <div class="file-drop-zone__hint">支援 JPG、PNG、WEBP 格式（純本地處理，安全無虞）</div>
        </div>
      </div>

      <!-- 壓縮設定面板（上傳後顯示） -->
      <div class="tool-section" id="options-section" style="display: none;">
        <div class="tool-section__title">壓縮設定</div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-lg);">
          <!-- 品質調整 -->
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="quality-range">
              壓縮品質：<span id="quality-value" style="color: var(--color-accent); font-weight: 700;">80%</span>
            </label>
            <input type="range" class="form-range" id="quality-range" min="10" max="100" value="80">
          </div>

          <!-- 格式轉換 -->
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="output-format">輸出格式：</label>
            <select class="form-select" id="output-format">
              <option value="image/jpeg" selected>JPEG (.jpg)</option>
              <option value="image/webp">WEBP (.webp — 推薦更小體積)</option>
              <option value="image/png">PNG (.png — 適合無損透明圖)</option>
            </select>
          </div>

          <!-- 最大寬度縮小 -->
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="max-dimension">最大寬度限制 (可選)：</label>
            <select class="form-select" id="max-dimension">
              <option value="original" selected>保持原始解析度</option>
              <option value="1920">最高 1920px (Full HD)</option>
              <option value="1280">最高 1280px (HD)</option>
              <option value="800">最高 800px (Web 常用)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 對比與下載區（壓縮後顯示） -->
      <div class="tool-section" id="compare-section" style="display: none;">
        <div class="tool-section__header">
          <div class="tool-section__title">壓縮前後對比</div>
          <div id="savings-badge" style="
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            background: var(--color-success-light);
            color: var(--color-success);
            font-weight: 700;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
          ">節省 0%</div>
        </div>

        <div class="tool-split" style="margin-top: var(--space-md);">
          <!-- 原始圖片 -->
          <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); text-align: center;">
            <div style="font-weight: 600; margin-bottom: var(--space-sm); color: var(--color-text-secondary);">原始圖片</div>
            <div style="height: 220px; display: flex; align-items: center; justify-content: center; background: var(--color-bg); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: var(--space-sm);">
              <img id="preview-original" style="max-height: 100%; max-width: 100%; object-fit: contain;" alt="原始圖片預覽">
            </div>
            <div style="font-size: 0.875rem; color: var(--color-text-tertiary);" id="info-original">大小：--</div>
          </div>

          <!-- 壓縮後圖片 -->
          <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); text-align: center;">
            <div style="font-weight: 600; margin-bottom: var(--space-sm); color: var(--color-accent);">壓縮後圖片</div>
            <div style="height: 220px; display: flex; align-items: center; justify-content: center; background: var(--color-bg); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: var(--space-sm);">
              <img id="preview-compressed" style="max-height: 100%; max-width: 100%; object-fit: contain;" alt="壓縮後圖片預覽">
            </div>
            <div style="font-size: 0.875rem; font-weight: 600; color: var(--color-success);" id="info-compressed">大小：--</div>
          </div>
        </div>

        <!-- 下載按鈕 -->
        <div class="tool-actions" style="margin-top: var(--space-xl);">
          <button class="btn btn--primary" id="btn-download" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            下載壓縮後的圖片
          </button>
          <button class="btn btn--secondary" id="btn-reupload" type="button">
            選擇其他圖片
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
