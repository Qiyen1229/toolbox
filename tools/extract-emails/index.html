<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Extract Emails (提取電子信箱) — 從任意文字、文件或網頁原始碼中快速萃取所有電子郵件地址，支援自動去重與一鍵複製。Qiyen Toolbox。">
  <title>提取電子信箱 (Extract Emails) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">提取電子信箱</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">提取電子信箱</span>
            <span class="tool-header__title-en">Extract Emails</span>
          </div>
        </h1>
        <p class="tool-header__description">從雜亂的文章、名單或原始碼中一鍵批量過濾抽出所有 Email，支援排序、自動去重與格式化匯出。</p>
      </header>

      <!-- 設定選項 -->
      <div class="tool-section">
        <div class="tool-section__title">提取設定</div>
        <div style="display: flex; gap: var(--space-lg); flex-wrap: wrap; align-items: center;">
          <label class="form-checkbox">
            <input type="checkbox" id="opt-unique" checked>
            <span>自動排除重複信箱 (Deduplicate)</span>
          </label>
          <label class="form-checkbox">
            <input type="checkbox" id="opt-sort" checked>
            <span>依字母排序 (A-Z Sort)</span>
          </label>
          <label class="form-checkbox">
            <input type="checkbox" id="opt-lowercase" checked>
            <span>全部轉為小寫字母</span>
          </label>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">分隔方式：</span>
            <select class="form-select" id="sep-select" style="width: auto; padding: 4px 8px; font-size: 0.8125rem;">
              <option value="\n" selected>換行 (New line)</option>
              <option value=", ">逗號 (, )</option>
              <option value="; ">分號 (; )</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 雙欄佈局 -->
      <div class="tool-split">
        <!-- 輸入文字 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title">原始文字內容</div>
            <button class="btn btn--sm btn--ghost" id="btn-sample" type="button">載入範例</button>
          </div>
          <textarea class="form-textarea" id="input-raw" rows="12" placeholder="請在此貼上包含電子郵件的任意文字…"></textarea>
          <div style="display: flex; justify-content: flex-end; margin-top: var(--space-xs);">
            <button class="btn btn--sm btn--ghost" id="btn-clear" type="button">清空</button>
          </div>
        </div>

        <!-- 提取結果 -->
        <div class="tool-section" style="margin-bottom: 0; display: flex; flex-direction: column;">
          <div class="tool-section__header">
            <div class="tool-section__title">提取結果</div>
            <span id="stats-badge" style="font-size: 0.8125rem; color: var(--color-accent); font-weight: 700;">共 0 個信箱</span>
          </div>
          <textarea class="form-textarea" id="output-emails" rows="12" readonly style="flex: 1; font-family: var(--font-mono, monospace); font-size: 0.8125rem;" placeholder="提取後的 Email 清單將顯示於此…"></textarea>
          <div style="display: flex; gap: var(--space-xs); margin-top: var(--space-sm);">
            <button class="btn btn--sm btn--secondary" id="btn-copy" type="button">一鍵複製</button>
            <button class="btn btn--sm btn--ghost" id="btn-download" type="button">下載 .txt</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
