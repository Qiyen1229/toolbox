<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="密碼產生器 — 自訂長度與字元類型，一鍵產生高強度密碼。Qiyen Toolbox 線上工具。">
  <title>密碼產生器 (Password Generator) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
  <style>
    /* 密碼顯示區專用樣式 */
    .password-display {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .password-display__text {
      flex: 1;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--color-text-primary);
      word-break: break-all;
      user-select: all;
      min-height: 1.5em;
      letter-spacing: 0.05em;
    }
    /* 密碼強度指示條 */
    .strength-bar {
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--color-border);
      margin-top: var(--space-sm);
      overflow: hidden;
    }
    .strength-bar__fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .strength-label {
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: var(--space-xs);
    }
    /* 選項網格 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-md);
    }
    .length-control {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    .length-control input[type="range"] {
      flex: 1;
    }
    .length-control__value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-accent);
      min-width: 48px;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <main class="tool-page">
    <div class="tool-container">

      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">密碼產生器</span>
      </div>

      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">密碼產生器</span>
            <span class="tool-header__title-en">Password Generator</span>
          </div>
        </h1>
        <p class="tool-header__description">自訂長度與字元類型，一鍵產生高強度密碼。使用瀏覽器原生 Crypto API 產生真隨機數。</p>
      </header>

      <!-- 密碼顯示區 -->
      <div class="password-display">
        <div class="password-display__text" id="password-output">點擊「產生密碼」開始</div>
        <button class="btn btn--sm btn--secondary" id="btn-copy" type="button" title="複製密碼">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>

      <!-- 密碼強度 -->
      <div style="margin-bottom: var(--space-lg);">
        <div class="strength-bar">
          <div class="strength-bar__fill" id="strength-fill" style="width: 0%;"></div>
        </div>
        <div class="strength-label" id="strength-label" style="color: var(--color-text-tertiary);">—</div>
      </div>

      <!-- 選項區 -->
      <div class="tool-section">
        <div class="tool-section__title">設定</div>

        <!-- 長度 -->
        <div class="form-group" style="margin-bottom: var(--space-lg);">
          <label class="form-label">密碼長度</label>
          <div class="length-control">
            <input type="range" class="form-range" id="length-slider" min="4" max="128" value="16">
            <span class="length-control__value" id="length-value">16</span>
          </div>
        </div>

        <!-- 字元類型 -->
        <div class="options-grid">
          <label class="checkbox">
            <input type="checkbox" id="opt-uppercase" checked>
            大寫字母 (A-Z)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="opt-lowercase" checked>
            小寫字母 (a-z)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="opt-numbers" checked>
            數字 (0-9)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="opt-symbols" checked>
            特殊符號 (!@#$...)
          </label>
        </div>
      </div>

      <!-- 操作按鈕 -->
      <div class="tool-actions">
        <button class="btn btn--primary btn--lg" id="btn-generate" type="button">
          🔑 產生密碼
        </button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
