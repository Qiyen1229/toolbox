<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="摩斯密碼轉換器 — 文字與摩斯電碼（Morse Code）雙向編解碼，支援純前端 Web Audio 嗶嗶電報音效即時播放。Qiyen Toolbox。">
  <title>摩斯密碼轉換器 (Morse Code) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">摩斯密碼轉換器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h2"/>
              <path d="M7 12h6"/>
              <path d="M16 12h2"/>
              <path d="M21 12h1"/>
              <path d="M4 18h4"/>
              <path d="M12 18h8"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">摩斯密碼轉換器</span>
            <span class="tool-header__title-en">Morse Code Converter</span>
          </div>
        </h1>
        <p class="tool-header__description">英文字母、數字與符號轉摩斯密碼雙向轉換，內建純前端電報音效發聲試聽。</p>
      </header>

      <!-- 轉換模式選單 -->
      <div class="tool-section">
        <div class="segmented-control" id="mode-selector" style="max-width: 400px; margin-bottom: var(--space-md);">
          <button class="segmented-control__item active" data-mode="text-to-morse">文字 → 摩斯密碼</button>
          <button class="segmented-control__item" data-mode="morse-to-text">摩斯密碼 → 文字</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr; gap: var(--space-md);">
          <!-- 輸入 -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" id="input-label" for="input-text">輸入文字（英文 / 數字）：</label>
              <button class="btn btn--sm btn--ghost" id="btn-clear">清空</button>
            </div>
            <textarea class="form-input" id="input-text" rows="4" placeholder="例如：SOS 或 HELLO WORLD" style="font-family: var(--font-mono, monospace);"></textarea>
          </div>

          <!-- 控制與播放按鈕 -->
          <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center;">
            <button class="btn btn--primary" id="btn-convert">轉換</button>
            <button class="btn btn--secondary" id="btn-play-sound">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              播放嗶嗶電報音
            </button>
            <button class="btn btn--ghost" id="btn-stop-sound" style="display: none;">停止播放</button>
          </div>

          <!-- 輸出 -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" id="output-label" for="output-text">轉換結果：</label>
              <button class="btn btn--sm btn--secondary" id="btn-copy">複製結果</button>
            </div>
            <textarea class="form-input" id="output-text" rows="4" readonly style="font-family: var(--font-mono, monospace); background: var(--color-surface);"></textarea>
          </div>
        </div>
      </div>

      <!-- 快速範例與對照說明 -->
      <div class="tool-section">
        <div class="info-card">
          <h3 style="font-size: 0.9375rem; font-weight: 700; margin-bottom: 8px;">常用對照與規則</h3>
          <p style="font-size: 0.8125rem; color: var(--color-text-secondary); line-height: 1.6;">
            • <code>·</code> (Dot / 滴) 代表短信號，<code>-</code> (Dash / 嗒) 代表長信號（長度為 3 倍短信號）。<br>
            • 字母與字母間以 <strong>空格</strong> 區隔；單字與單字之間以 <code>/</code> 斜線區隔。<br>
            • 經典求救信號 <strong>SOS</strong> 即為：<code>... --- ...</code>
          </p>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
