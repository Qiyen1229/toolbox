<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="日期加減計算器 — 指定日期快速增加或減少天數、週數、月數、年數（如 今天 + 90 天），自動顯示星期幾與農曆資訊。Qiyen Toolbox。">
  <title>日期加減計算器 (Date Calculator) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">日期加減計算器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <line x1="12" y1="14" x2="12" y2="18"></line>
              <line x1="10" y1="16" x2="14" y2="16"></line>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">日期加減計算器</span>
            <span class="tool-header__title-en">Date Add / Subtract</span>
          </div>
        </h1>
        <p class="tool-header__description">指定基準日快速增加或倒推天數、月數、年數（如：今天起算 90 天到期日）。</p>
      </header>

      <!-- 輸入區塊 -->
      <div class="tool-section">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-md);">
          
          <div class="form-group">
            <label class="form-label" for="base-date">基準日期：</label>
            <input type="date" class="form-input" id="base-date">
            <div style="display: flex; gap: 6px; margin-top: 6px;">
              <button class="btn btn--xs btn--ghost" id="btn-set-today">設為今天</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">運算方式與數值：</label>
            <div style="display: flex; gap: 8px;">
              <select class="form-input" id="calc-op" style="width: 100px;">
                <option value="add" selected>增加 (+)</option>
                <option value="sub">減少 (-)</option>
              </select>
              <input type="number" class="form-input" id="offset-num" value="90" min="1" step="1" style="flex: 1; font-weight: 700;">
              <select class="form-input" id="offset-unit" style="width: 100px;">
                <option value="days" selected>天</option>
                <option value="weeks">週</option>
                <option value="months">個月</option>
                <option value="years">年</option>
              </select>
            </div>

            <!-- 快捷標籤 -->
            <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
              <button class="btn btn--xs btn--ghost btn-quick-offset" data-op="add" data-num="7" data-unit="days">+7天</button>
              <button class="btn btn--xs btn--ghost btn-quick-offset" data-op="add" data-num="30" data-unit="days">+30天</button>
              <button class="btn btn--xs btn--ghost btn-quick-offset" data-op="add" data-num="90" data-unit="days">+90天</button>
              <button class="btn btn--xs btn--ghost btn-quick-offset" data-op="add" data-num="180" data-unit="days">+180天</button>
              <button class="btn btn--xs btn--ghost btn-quick-offset" data-op="add" data-num="1" data-unit="years">+1年</button>
            </div>
          </div>

        </div>
      </div>

      <!-- 計算結果卡片 -->
      <div class="tool-section">
        <div style="background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(168,85,247,0.08) 100%); border: 2px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-lg);">
          
          <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--space-md); margin-bottom: var(--space-lg);">
            <div>
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary); text-transform: uppercase;">計算到達日期 (Target Date)</span>
              <div id="target-date-display" style="font-size: 2.5rem; font-weight: 800; color: var(--color-accent); line-height: 1.2;">
                2026 年 12 月 21 日
              </div>
            </div>
            <button class="btn btn--secondary" id="btn-copy-date">複製日期</button>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); border-top: 1px dashed var(--color-border); padding-top: var(--space-md); font-size: 0.875rem;">
            <div>
              <span style="color: var(--color-text-secondary);">星期幾：</span>
              <div id="target-dayofweek" style="font-weight: 700; color: var(--color-success); font-size: 1.125rem;">星期一</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">標準 ISO 格式：</span>
              <div id="target-iso" style="font-weight: 700; font-family: var(--font-mono, monospace);">2026-12-21</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">當年度第幾週：</span>
              <div id="target-weeknum" style="font-weight: 700;">第 51 週</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
