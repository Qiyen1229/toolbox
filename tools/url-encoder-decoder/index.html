<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="URL Encoder / Decoder — 線上網址編碼與解碼工具，支援 encodeURIComponent 與 encodeURI 兩種模式，即時轉換中文字元與特殊符號。">
  <title>URL 編碼/解碼 (URL Encoder / Decoder) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">URL 編碼/解碼</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">URL 編碼/解碼</span>
            <span class="tool-header__title-en">URL Encoder / Decoder</span>
          </div>
        </h1>
        <p class="tool-header__description">URL 百分比編碼與解碼，快速處理網址參數、特殊符號與中文字元轉換。</p>
      </header>

      <!-- 模式切換 Tabs -->
      <div style="display: flex; gap: var(--space-xs); margin-bottom: var(--space-lg); border-bottom: 2px solid var(--color-border);">
        <button class="btn btn--sm btn--primary" id="tab-encode" style="border-radius: var(--radius-md) var(--radius-md) 0 0;">
          編碼 (Encode)
        </button>
        <button class="btn btn--sm btn--ghost" id="tab-decode" style="border-radius: var(--radius-md) var(--radius-md) 0 0;">
          解碼 (Decode)
        </button>
      </div>

      <!-- 編碼模式選項 -->
      <div class="tool-options" style="margin-bottom: var(--space-md);">
        <div class="tool-option">
          <span class="tool-option__label">編碼範圍：</span>
          <label class="form-checkbox" style="display: inline-flex; align-items: center; margin-right: var(--space-md);">
            <input type="radio" name="encode-mode" value="component" checked>
            <span>參數編碼 (encodeURIComponent — 推薦，包含 &amp;, =, /, ?)</span>
          </label>
          <label class="form-checkbox" style="display: inline-flex; align-items: center;">
            <input type="radio" name="encode-mode" value="full">
            <span>完整網址 (encodeURI — 保留網址協議與架構)</span>
          </label>
        </div>
      </div>

      <!-- 左右/上下佈局 -->
      <div class="tool-split">
        <!-- 輸入 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title" id="input-label">輸入字串（待編碼）</div>
            <button class="btn btn--sm btn--ghost" id="btn-sample" type="button">載入範例</button>
          </div>
          <textarea
            class="form-textarea"
            id="url-input"
            placeholder="請在此輸入要處理的文字或網址…"
            rows="8"
          ></textarea>
        </div>

        <!-- 輸出 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title" id="output-label">輸出結果</div>
            <button class="btn btn--sm btn--secondary" id="btn-copy" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              複製
            </button>
          </div>
          <textarea
            class="form-textarea"
            id="url-output"
            placeholder="轉換結果將即時顯示於此…"
            rows="8"
            readonly
          ></textarea>
        </div>
      </div>

      <!-- 錯誤提示 -->
      <div id="url-error" style="display: none; color: var(--color-error); font-size: 0.875rem; margin-top: var(--space-md); padding: var(--space-sm) var(--space-md); background: var(--color-error-light); border-radius: var(--radius-sm);"></div>

      <!-- 操作按鈕 -->
      <div class="tool-actions" style="margin-top: var(--space-lg);">
        <button class="btn btn--secondary" id="btn-swap" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
          交換輸入與輸出 (Swap)
        </button>
        <button class="btn btn--ghost" id="btn-clear" type="button">
          清除
        </button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
