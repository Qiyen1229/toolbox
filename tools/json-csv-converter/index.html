<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JSON 與 CSV 互轉器 — JSON 轉 CSV 表格或 CSV 轉 JSON 物件陣列，支援自訂分隔符（逗號、分號、Tab）與雙向轉換。Qiyen Toolbox。">
  <title>JSON ↔ CSV 資料互轉器 — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">JSON ↔ CSV 互轉器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <path d="M8 13h8"/>
              <path d="M8 17h8"/>
              <path d="M10 9h4"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">JSON ↔ CSV 互轉器</span>
            <span class="tool-header__title-en">JSON / CSV Converter</span>
          </div>
        </h1>
        <p class="tool-header__description">雙向轉換 JSON 物件陣列與 CSV 表格資料，支援自訂分隔符號與引號跳脫防護。</p>
      </header>

      <!-- 模式切換與設定列 -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: var(--space-md);">
        <div style="display: flex; gap: var(--space-xs);">
          <button class="btn btn--sm btn--primary" id="btn-mode-json2csv">JSON ➔ CSV</button>
          <button class="btn btn--sm btn--ghost" id="btn-mode-csv2json">CSV ➔ JSON</button>
        </div>

        <div style="display: flex; align-items: center; gap: var(--space-sm);">
          <label class="form-label" for="delimiter-select" style="margin: 0; white-space: nowrap;">CSV 分隔符：</label>
          <select class="form-select" id="delimiter-select" style="width: auto;">
            <option value="," selected>逗號 (Comma ,)</option>
            <option value=";">分號 (Semicolon ;)</option>
            <option value="&#9;">Tab (製表符 \t)</option>
          </select>
        </div>
      </div>

      <!-- 左右分割佈局 -->
      <div class="tool-split">
        <!-- 輸入端 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title" id="input-title">輸入 JSON 資料</div>
            <button class="btn btn--sm btn--ghost" id="btn-sample" type="button">載入範例</button>
          </div>
          <textarea class="form-textarea" id="input-text" rows="14" placeholder="請在此輸入資料…" style="font-family: var(--font-mono, monospace); font-size: 0.8125rem;"></textarea>

          <div style="display: flex; justify-content: flex-end; margin-top: var(--space-sm);">
            <button class="btn btn--sm btn--ghost" id="btn-clear" type="button">清空</button>
          </div>
        </div>

        <!-- 輸出端 -->
        <div class="tool-section" style="margin-bottom: 0; display: flex; flex-direction: column;">
          <div class="tool-section__header">
            <div class="tool-section__title" id="output-title">轉換結果 (CSV)</div>
            <button class="btn btn--sm btn--secondary" id="btn-copy" type="button">複製結果</button>
          </div>
          <textarea class="form-textarea" id="output-text" rows="14" readonly style="font-family: var(--font-mono, monospace); font-size: 0.8125rem; flex: 1;" placeholder="轉換結果將即時顯示於此…"></textarea>

          <div class="tool-actions" style="margin-top: var(--space-md);">
            <button class="btn btn--primary btn--sm" id="btn-download" type="button">下載檔案</button>
          </div>
        </div>
      </div>

      <!-- 錯誤訊息提示 -->
      <div id="error-msg" style="display: none; color: var(--color-error); font-size: 0.875rem; margin-top: var(--space-md); padding: var(--space-sm) var(--space-md); background: var(--color-error-light); border-radius: var(--radius-sm);"></div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
