<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SQL Formatter — 本地 SQL 格式化美化工具，支援關鍵字自動大寫、自訂縮排深度、子句換行與語句壓縮。Qiyen Toolbox。">
  <title>SQL 格式化器 (SQL Formatter) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">SQL 格式化器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">SQL 格式化器</span>
            <span class="tool-header__title-en">SQL Formatter</span>
          </div>
        </h1>
        <p class="tool-header__description">美化與重構 SQL 查詢語句，自動大寫關鍵字並進行階層縮排。</p>
      </header>

      <!-- 操作工具列 -->
      <div class="tool-actions">
        <button class="btn btn--primary" id="btn-format">✨ 格式化 SQL</button>
        <button class="btn btn--secondary" id="btn-minify">單行壓縮</button>
        <button class="btn btn--secondary" id="btn-demo">載入範例</button>
        <button class="btn btn--ghost" id="btn-clear">清除</button>
        <div style="flex:1;"></div>
        <select class="form-select" id="indent-select" style="width: 130px; font-size: 0.8125rem;">
          <option value="2">2 空格縮排</option>
          <option value="4" selected>4 空格縮排</option>
        </select>
        <button class="btn btn--secondary" id="btn-copy">複製結果</button>
      </div>

      <!-- 編輯區 -->
      <div class="tool-split" style="margin-top: var(--space-md);">
        <div class="tool-panel">
          <div class="tool-panel__header">
            <span class="tool-panel__title">原始 SQL</span>
          </div>
          <div class="tool-panel__body">
            <textarea class="form-input" id="sql-input" rows="16" placeholder="請在此貼上 SQL 語句..." style="width: 100%; font-family: var(--font-mono, monospace); font-size: 0.875rem;"></textarea>
          </div>
        </div>

        <div class="tool-panel">
          <div class="tool-panel__header">
            <span class="tool-panel__title">格式化輸出</span>
          </div>
          <div class="tool-panel__body">
            <pre id="sql-output" style="
              background: var(--color-bg);
              border: 1px solid var(--color-border);
              border-radius: var(--radius-sm);
              padding: var(--space-md);
              min-height: 380px;
              max-height: 480px;
              overflow: auto;
              font-family: var(--font-mono, monospace);
              font-size: 0.875rem;
              white-space: pre-wrap;
              color: var(--color-text-primary);
            "></pre>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
