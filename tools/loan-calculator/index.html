<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="房貸與信用貸款計算器 — 支援本息平均攤還、本金平均攤還與寬限期試算，即時預估每月還款額與總利息負擔。Qiyen Toolbox。">
  <title>貸款計算器 (Loan Calculator) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">貸款計算器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18"/>
              <path d="M3 10h18"/>
              <path d="M5 6l7-3 7 3"/>
              <path d="M4 10v11"/>
              <path d="M20 10v11"/>
              <path d="M8 14v3"/>
              <path d="M12 14v3"/>
              <path d="M16 14v3"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">房貸與信用貸款計算器</span>
            <span class="tool-header__title-en">Loan & Mortgage Calculator</span>
          </div>
        </h1>
        <p class="tool-header__description">房貸、車貸、信貸試算，支援「本息均攤」與「本金均攤」及寬限期，清晰查看總利息支出。</p>
      </header>

      <!-- 輸入區塊 -->
      <div class="tool-section">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-md);">
          
          <div class="form-group">
            <label class="form-label" for="loan-amount">貸款金額 (萬元)：</label>
            <input type="number" class="form-input" id="loan-amount" value="1000" min="1" step="10" style="font-size: 1.125rem; font-weight: 700;">
          </div>

          <div class="form-group">
            <label class="form-label" for="loan-years">貸款年限 (年)：</label>
            <input type="number" class="form-input" id="loan-years" value="30" min="1" max="50" step="1">
          </div>

          <div class="form-group">
            <label class="form-label" for="loan-rate">年利率 (%)：</label>
            <input type="number" class="form-input" id="loan-rate" value="2.18" min="0.01" max="30" step="0.01">
          </div>

          <div class="form-group">
            <label class="form-label" for="repay-method">還款方式：</label>
            <select class="form-input" id="repay-method">
              <option value="annuity" selected>本息平均攤還（每月固定）</option>
              <option value="linear">本金平均攤還（首月最高逐月降）</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="grace-period">寬限期（只繳息不還本）：</label>
            <select class="form-input" id="grace-period">
              <option value="0" selected>無寬限期 (0 年)</option>
              <option value="1">1 年</option>
              <option value="2">2 年</option>
              <option value="3">3 年</option>
              <option value="5">5 年</option>
            </select>
          </div>

        </div>
      </div>

      <!-- 計算結算卡片 -->
      <div class="tool-section">
        <div style="background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(168,85,247,0.08) 100%); border: 2px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-lg);">
          
          <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--space-md); margin-bottom: var(--space-lg);">
            <div>
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary); text-transform: uppercase;">首期 / 每月還款額</span>
              <div id="monthly-payment" style="font-size: 2.25rem; font-weight: 800; color: var(--color-accent); line-height: 1.2;">
                NT$ 37,880
              </div>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">累計支付總利息</span>
              <div id="total-interest" style="font-size: 1.5rem; font-weight: 700; color: var(--color-danger);">
                NT$ 3,636,800
              </div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); border-top: 1px dashed var(--color-border); padding-top: var(--space-md); font-size: 0.875rem;">
            <div>
              <span style="color: var(--color-text-secondary);">貸款總本金：</span>
              <div id="summary-principal" style="font-weight: 700;">NT$ 10,000,000</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">本息合計總還款：</span>
              <div id="summary-total-repaid" style="font-weight: 700; color: var(--color-text-primary);">NT$ 13,636,800</div>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">總期數：</span>
              <div id="summary-months" style="font-weight: 700;">360 期 (30 年)</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
