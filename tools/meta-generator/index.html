<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meta Tag Generator — 快速產生符合 SEO 與各大社群標準的 HTML Meta 標籤，支援 Open Graph、Twitter Card、Robots 與 PWA 設定。">
  <title>SEO Meta 標籤產生器 (Meta Tag Generator) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">SEO Meta 標籤產生器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"/>
              <line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">SEO Meta 標籤產生器</span>
            <span class="tool-header__title-en">Meta Tag Generator</span>
          </div>
        </h1>
        <p class="tool-header__description">視覺化輸入網站參數，一鍵產生符合 Google 搜尋引擎與 Facebook、LINE、Twitter 社群規範的完整 HTML 標籤。</p>
      </header>

      <!-- 左右雙欄 -->
      <div class="tool-split">
        <!-- 左欄：輸入表單 -->
        <div class="tool-section" style="margin-bottom: 0;">
          <div class="tool-section__header">
            <div class="tool-section__title">網站與 SEO 欄位</div>
            <button class="btn btn--sm btn--ghost" id="btn-sample" type="button">載入範例</button>
          </div>

          <div style="display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-md);">
            <div class="form-group" style="margin: 0;">
              <label class="form-label" for="meta-title">網站標題 (Title)：</label>
              <input type="text" class="form-input" id="meta-title" placeholder="網站主要標題 (建議 50-60 字以內)">
            </div>

            <div class="form-group" style="margin: 0;">
              <label class="form-label" for="meta-desc">網站說明 (Description)：</label>
              <textarea class="form-textarea" id="meta-desc" rows="3" placeholder="建議 120-160 字以內的簡潔網站摘要"></textarea>
            </div>

            <div class="form-group" style="margin: 0;">
              <label class="form-label" for="meta-keywords">關鍵字 (Keywords，以逗號分隔)：</label>
              <input type="text" class="form-input" id="meta-keywords" placeholder="工具箱, 線上工具, 網頁開發">
            </div>

            <div class="form-group" style="margin: 0;">
              <label class="form-label" for="meta-author">作者名稱 (Author)：</label>
              <input type="text" class="form-input" id="meta-author" placeholder="例如：Qiyen">
            </div>

            <div class="form-group" style="margin: 0;">
              <label class="form-label" for="meta-url">權威網址 (Canonical URL)：</label>
              <input type="text" class="form-input" id="meta-url" placeholder="https://toolbox.qiyen.dev/">
            </div>

            <div class="form-group" style="margin: 0;">
              <label class="form-label" for="meta-image">社群預覽圖網址 (OG Image)：</label>
              <input type="text" class="form-input" id="meta-image" placeholder="https://example.com/og-image.jpg">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
              <div class="form-group" style="margin: 0;">
                <label class="form-label" for="meta-robots">爬蟲搜尋設定 (Robots)：</label>
                <select class="form-select" id="meta-robots">
                  <option value="index, follow" selected>允許索引並追蹤連結 (預設推薦)</option>
                  <option value="noindex, follow">不索引但追蹤連結</option>
                  <option value="noindex, nofollow">完全不索引不追蹤 (後台專用)</option>
                </select>
              </div>

              <div class="form-group" style="margin: 0;">
                <label class="form-label" for="meta-theme">瀏覽器頂部色 (Theme Color)：</label>
                <input type="color" class="form-input" id="meta-theme" value="#0b1120" style="height: 38px; padding: 2px;">
              </div>
            </div>
          </div>
        </div>

        <!-- 右欄：產生的 HTML 代碼 -->
        <div class="tool-section" style="margin-bottom: 0; display: flex; flex-direction: column;">
          <div class="tool-section__header">
            <div class="tool-section__title">生成的 HTML 代碼</div>
            <button class="btn btn--sm btn--secondary" id="btn-copy-code" type="button">一鍵複製</button>
          </div>

          <textarea class="form-textarea" id="meta-output" rows="18" readonly style="font-family: var(--font-mono, monospace); font-size: 0.8125rem; flex: 1; margin-top: var(--space-md);"></textarea>

          <div class="tool-actions" style="margin-top: var(--space-md);">
            <button class="btn btn--primary btn--sm" id="btn-download-html" type="button">下載為 head-meta.html</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
