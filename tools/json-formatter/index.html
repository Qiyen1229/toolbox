<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JSON Formatter — JSON 美化、壓縮、驗證，即時錯誤提示。Qiyen Toolbox 線上工具。">
  <title>JSON 格式化工具 (JSON Formatter) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">JSON 格式化工具</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/>
              <path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">JSON 格式化工具</span>
            <span class="tool-header__title-en">JSON Formatter</span>
          </div>
        </h1>
        <p class="tool-header__description">JSON 美化、壓縮、驗證，即時錯誤提示。支援一鍵複製結果。</p>
      </header>

      <!-- 輸入區 -->
      <div class="tool-section">
        <div class="tool-section__title">輸入</div>
        <textarea
          class="form-textarea"
          id="json-input"
          placeholder='在此貼上 JSON 字串，例如：{"name": "Qiyen", "age": 19}'
          rows="10"
          spellcheck="false"
        ></textarea>
        <!-- 錯誤提示 -->
        <div id="json-error" style="display:none; margin-top: var(--space-sm); padding: var(--space-sm) var(--space-md); background: var(--color-error-light); border-radius: var(--radius-sm); color: var(--color-error); font-size: 0.8125rem; font-weight: 500;">
        </div>
      </div>

      <!-- 操作按鈕 -->
      <div class="tool-actions">
        <button class="btn btn--primary" id="btn-format" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          美化 (Format)
        </button>
        <button class="btn btn--secondary" id="btn-minify" type="button">
          壓縮 (Minify)
        </button>
        <button class="btn btn--secondary" id="btn-validate" type="button">
          驗證 (Validate)
        </button>
        <button class="btn btn--secondary" id="btn-sample" type="button">
          範例 (Sample)
        </button>
        <button class="btn btn--ghost" id="btn-clear" type="button">
          清除
        </button>
      </div>

      <!-- 縮排選項 -->
      <div class="tool-options">
        <div class="tool-option">
          <span class="tool-option__label">縮排方式：</span>
          <select class="form-select" id="indent-type" style="width: auto; min-width: 140px;">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </div>
      </div>

      <!-- 結果區 -->
      <div class="tool-result" id="result-section" style="display:none;">
        <div class="tool-result__header">
          <span class="tool-result__label">結果</span>
          <button class="btn btn--sm btn--secondary" id="btn-copy" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            複製
          </button>
        </div>
        <pre class="tool-result__content" id="json-output"></pre>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
