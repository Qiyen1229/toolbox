<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Countdown Timer — 倒數計時器，支援自訂時間、蕃茄鐘預設、圓形進度環與到時音效提醒。Qiyen Toolbox 線上工具。">
  <title>Countdown Timer — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">Countdown Timer</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4"/>
              <path d="M10 2h4"/>
              <path d="M12 2v3"/>
              <path d="M5 5l1.5 1.5"/>
              <path d="M17.5 6.5L19 5"/>
            </svg>
          </div>
          Countdown Timer
        </h1>
        <p class="tool-header__description">自訂倒數時間與蕃茄鐘模式，具備動態進度環與到時提示鈴聲。</p>
      </header>

      <!-- 快捷時間標籤 -->
      <div style="display: flex; gap: var(--space-xs); flex-wrap: wrap; justify-content: center; margin-bottom: var(--space-xl);" id="preset-buttons">
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="60">1 分鐘</button>
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="300">5 分鐘</button>
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="600">10 分鐘</button>
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="900">15 分鐘</button>
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="1500" style="color: var(--color-accent); font-weight: 700;">🍅 25 分鐘蕃茄鐘</button>
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="1800">30 分鐘</button>
        <button class="btn btn--sm btn--secondary btn-preset" data-seconds="3600">1 小時</button>
      </div>

      <!-- 倒數計時主介面 -->
      <div class="tool-section" style="text-align: center; padding: var(--space-2xl) var(--space-md);">
        
        <!-- 圓形進度環與時間文字 -->
        <div style="position: relative; width: 260px; height: 260px; margin: 0 auto var(--space-xl);">
          <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; transform: rotate(-90deg);">
            <!-- 背景圓軌道 -->
            <circle cx="50" cy="50" r="44" stroke="var(--color-border)" stroke-width="6" fill="transparent"/>
            <!-- 動態進度圓環 -->
            <circle id="progress-ring" cx="50" cy="50" r="44" stroke="var(--color-accent)" stroke-width="6" stroke-linecap="round" fill="transparent" stroke-dasharray="276.46" stroke-dashoffset="0" style="transition: stroke-dashoffset 0.3s ease;"/>
          </svg>

          <!-- 圓心剩餘時間 -->
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div id="timer-display" style="
              font-family: var(--font-mono, monospace);
              font-size: 2.5rem;
              font-weight: 800;
              color: var(--color-text-primary);
              user-select: none;
            ">05:00</div>
            <div id="timer-status" style="font-size: 0.8125rem; color: var(--color-text-tertiary); margin-top: 4px;">準備就緒</div>
          </div>
        </div>

        <!-- 時間手動設定（停止時可見） -->
        <div id="inputs-wrapper" style="display: flex; justify-content: center; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-xl);">
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="number" class="form-input" id="input-hours" min="0" max="99" value="0" style="width: 65px; text-align: center; font-family: var(--font-mono, monospace);">
            <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">時</span>
          </div>
          <span style="font-weight: 700; color: var(--color-text-tertiary);">:</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="number" class="form-input" id="input-minutes" min="0" max="59" value="5" style="width: 65px; text-align: center; font-family: var(--font-mono, monospace);">
            <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">分</span>
          </div>
          <span style="font-weight: 700; color: var(--color-text-tertiary);">:</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="number" class="form-input" id="input-seconds" min="0" max="59" value="0" style="width: 65px; text-align: center; font-family: var(--font-mono, monospace);">
            <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">秒</span>
          </div>
        </div>

        <!-- 主控制按鈕組 -->
        <div style="display: flex; justify-content: center; gap: var(--space-md); flex-wrap: wrap;">
          <button class="btn btn--lg btn--primary" id="btn-start" style="min-width: 140px; font-weight: 700;">
            開始倒數
          </button>
          <button class="btn btn--lg btn--secondary" id="btn-add-minute" style="min-width: 110px;">
            +1 分鐘
          </button>
          <button class="btn btn--lg btn--ghost" id="btn-reset" style="min-width: 110px;">
            重設
          </button>
        </div>

      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
