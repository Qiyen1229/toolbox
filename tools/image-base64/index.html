<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="圖片對 Base64 互轉 — 本地將圖片轉換為 Base64 Data URL（支援 HTML img、CSS、Markdown 一鍵複製），或將 Base64 字串還原為圖片下載。">
  <title>圖片對 Base64 互轉 (Image Base64 Converter) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">圖片對 Base64 互轉</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">圖片對 Base64 互轉</span>
            <span class="tool-header__title-en">Image Base64 Converter</span>
          </div>
        </h1>
        <p class="tool-header__description">網頁開發必備工具，快速將本機圖片編碼為 Data URL，或將 Base64 編碼字串還原為圖片匯出。</p>
      </header>

      <!-- 雙模式切換 Tabs -->
      <div style="display: flex; gap: var(--space-xs); margin-bottom: var(--space-lg); border-bottom: 2px solid var(--color-border);">
        <button class="btn btn--sm btn--primary" id="tab-img2b64" style="border-radius: var(--radius-md) var(--radius-md) 0 0;">
          圖片 ➔ Base64
        </button>
        <button class="btn btn--sm btn--ghost" id="tab-b642img" style="border-radius: var(--radius-md) var(--radius-md) 0 0;">
          Base64 ➔ 圖片
        </button>
      </div>

      <!-- 模式一：圖片轉 Base64 -->
      <div id="panel-img2b64">
        <div class="tool-section">
          <div class="file-drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <div class="file-drop-zone__icon">🖼️</div>
            <div class="file-drop-zone__text">點擊選擇圖片，或拖曳圖片至此處</div>
            <div class="file-drop-zone__hint">支援 PNG、JPG、WEBP、SVG、GIF 等格式</div>
          </div>
        </div>

        <div class="tool-section" id="b64-result-section" style="display: none;">
          <div class="tool-section__header">
            <div class="tool-section__title">Base64 編碼結果</div>
            <div id="img-stats-badge" style="font-size: 0.8125rem; color: var(--color-text-secondary); font-weight: 600;">--</div>
          </div>

          <div class="tool-split" style="margin-top: var(--space-md);">
            <!-- 縮圖預覽 -->
            <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); text-align: center;">
              <div style="font-weight: 600; margin-bottom: var(--space-sm); color: var(--color-text-secondary);">圖片預覽</div>
              <div style="height: 180px; display: flex; align-items: center; justify-content: center; background: var(--color-bg); border-radius: var(--radius-sm); overflow: hidden;">
                <img id="preview-thumb" style="max-height: 100%; max-width: 100%; object-fit: contain;" alt="預覽圖">
              </div>
            </div>

            <!-- Base64 字串 -->
            <div style="display: flex; flex-direction: column;">
              <textarea class="form-textarea" id="output-b64" rows="8" readonly style="font-family: var(--font-mono, monospace); font-size: 0.75rem; word-break: break-all; flex: 1;" placeholder="Base64 Data URL 將顯示於此…"></textarea>
            </div>
          </div>

          <!-- 一鍵複製快捷列 -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-sm); margin-top: var(--space-md);">
            <button class="btn btn--secondary btn--sm" id="btn-copy-raw">複製純 Data URL</button>
            <button class="btn btn--secondary btn--sm" id="btn-copy-html">複製 HTML &lt;img&gt;</button>
            <button class="btn btn--secondary btn--sm" id="btn-copy-css">複製 CSS 樣式</button>
            <button class="btn btn--secondary btn--sm" id="btn-copy-md">複製 Markdown</button>
          </div>
        </div>
      </div>

      <!-- 模式二：Base64 轉圖片 -->
      <div id="panel-b642img" style="display: none;">
        <div class="tool-section">
          <div class="tool-section__header">
            <div class="tool-section__title">貼上 Base64 字串</div>
            <button class="btn btn--sm btn--ghost" id="btn-load-sample" type="button">載入範例</button>
          </div>
          <textarea class="form-textarea" id="input-b64-string" rows="6" placeholder="請在此貼上 data:image/... 或純 Base64 字串…" style="font-family: var(--font-mono, monospace); font-size: 0.8125rem;"></textarea>

          <div class="tool-actions" style="margin-top: var(--space-md);">
            <button class="btn btn--primary" id="btn-render-img" type="button">立即還原圖片</button>
            <button class="btn btn--ghost" id="btn-clear-b64" type="button">清空</button>
          </div>
        </div>

        <div class="tool-section" id="reverse-result-section" style="display: none;">
          <div class="tool-section__title">圖片還原結果</div>
          <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-lg); text-align: center; margin-top: var(--space-md);">
            <div style="max-height: 400px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: var(--space-md);">
              <img id="reverse-preview-img" style="max-height: 360px; max-width: 100%; object-fit: contain; box-shadow: var(--shadow-sm); border-radius: var(--radius-sm);" alt="還原圖片">
            </div>
            <button class="btn btn--primary" id="btn-download-restored" type="button">
              下載還原的圖片
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
