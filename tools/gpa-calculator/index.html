<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GPA 學期成績平均計算器 — 支援台灣頂大 4.3 滿分制與留學 4.0 制，多科目學分等第加權平均計算。Qiyen Toolbox。">
  <title>GPA 計算器 (GPA Calculator) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">GPA 計算器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">大學 GPA 學期成績計算器</span>
            <span class="tool-header__title-en">GPA Calculator</span>
          </div>
        </h1>
        <p class="tool-header__description">支援台灣大學院校 4.3 滿分制與留學標準 4.0 制，多科目學分等第快速結算。</p>
      </header>

      <!-- 設定與功能 -->
      <div class="tool-section">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-md); margin-bottom: var(--space-md);">
          <div style="display: flex; align-items: center; gap: 8px;">
            <label class="form-label" style="margin: 0;">計分體系標準：</label>
            <select class="form-input" id="gpa-scale" style="width: 180px; font-weight: 700;">
              <option value="4.3" selected>4.3 制 (台大/北商大/政大)</option>
              <option value="4.0">4.0 制 (美加留學標準)</option>
            </select>
          </div>

          <div style="display: flex; gap: 8px;">
            <button class="btn btn--sm btn--primary" id="btn-add-course">+ 新增科目</button>
            <button class="btn btn--sm btn--ghost" id="btn-sample">載入範例課表</button>
          </div>
        </div>

        <!-- 課程清單表格 -->
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
            <thead>
              <tr style="border-bottom: 2px solid var(--color-border); color: var(--color-text-secondary);">
                <th style="padding: 8px;">課程名稱</th>
                <th style="padding: 8px; width: 100px;">學分數</th>
                <th style="padding: 8px; width: 140px;">成績等第</th>
                <th style="padding: 8px; width: 60px; text-align: center;">操作</th>
              </tr>
            </thead>
            <tbody id="course-rows">
              <!-- 動態渲染課程列表 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 計算結算結果 -->
      <div class="tool-section">
        <div style="background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(168,85,247,0.08) 100%); border: 2px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-lg);">
          
          <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--space-md); margin-bottom: var(--space-lg);">
            <div>
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary); text-transform: uppercase;">學期總 GPA</span>
              <div id="gpa-result" style="font-size: 3rem; font-weight: 900; color: var(--color-accent); line-height: 1.1;">
                3.92
              </div>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.8125rem; color: var(--color-text-secondary);">總等第積分點</span>
              <div id="total-points" style="font-size: 1.5rem; font-weight: 700; color: var(--color-text-primary);">
                66.6
              </div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); border-top: 1px dashed var(--color-border); padding-top: var(--space-md); font-size: 0.875rem;">
            <div>
              <span style="color: var(--color-text-secondary);">總修習學分：</span>
              <strong id="total-credits" style="color: var(--color-text-primary); margin-left: 4px;">17 學分</strong>
            </div>
            <div>
              <span style="color: var(--color-text-secondary);">平均單科積分：</span>
              <strong id="avg-course-point" style="color: var(--color-text-primary); margin-left: 4px;">3.92</strong>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
