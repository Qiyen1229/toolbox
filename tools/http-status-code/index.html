<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HTTP Status Code — 完整 HTTP 狀態碼速查手冊，收錄 1xx~5xx 狀態碼、中英文詳細說明、RFC 標準規範與常見排查方案。Qiyen Toolbox。">
  <title>HTTP 狀態碼速查 (HTTP Status Code) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">HTTP 狀態碼速查</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">HTTP 狀態碼速查</span>
            <span class="tool-header__title-en">HTTP Status Code</span>
          </div>
        </h1>
        <p class="tool-header__description">快速查詢 1xx ~ 5xx HTTP 狀態碼的中英文含意、RFC 官方規範與開發除錯說明。</p>
      </header>

      <!-- 搜尋與分類切換 -->
      <div class="tool-section">
        <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap;">
          <input type="text" class="form-input" id="search-status" placeholder="搜尋狀態碼（如 200, 404, Forbidden, timeout）..." style="flex: 1; min-width: 250px;">
          <div style="display: flex; gap: var(--space-xs); flex-wrap: wrap;" id="status-tabs">
            <button class="btn btn--sm btn--primary status-tab-btn" data-type="all">全部</button>
            <button class="btn btn--sm btn--ghost status-tab-btn" data-type="1xx">1xx 資訊</button>
            <button class="btn btn--sm btn--ghost status-tab-btn" data-type="2xx">2xx 成功</button>
            <button class="btn btn--sm btn--ghost status-tab-btn" data-type="3xx">3xx 重新導向</button>
            <button class="btn btn--sm btn--ghost status-tab-btn" data-type="4xx">4xx 用戶端錯誤</button>
            <button class="btn btn--sm btn--ghost status-tab-btn" data-type="5xx">5xx 伺服器錯誤</button>
          </div>
        </div>
      </div>

      <!-- 狀態碼清單網格 -->
      <div id="status-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-md); margin-top: var(--space-lg);"></div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
