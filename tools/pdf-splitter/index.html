<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PDF 分割器 — 本地擷取 PDF 指定頁面或將多頁 PDF 拆分為單頁，支援頁碼範圍輸入與一鍵打包 ZIP。Qiyen Toolbox 純本地運算。">
  <title>PDF 分割器 (PDF Splitter) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">PDF 分割器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="12" y1="9" x2="12" y2="17"/>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">PDF 分割器</span>
            <span class="tool-header__title-en">PDF Splitter</span>
          </div>
        </h1>
        <p class="tool-header__description">本地分割或擷取 PDF 文件的特定頁面，支援頁碼範圍提取或整份拆解為獨立頁面。</p>
      </header>

      <!-- 檔案上傳 -->
      <div class="tool-section">
        <div class="file-drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="application/pdf" style="display: none;">
          <div class="file-drop-zone__icon">📑</div>
          <div class="file-drop-zone__text">點擊選擇 PDF 檔案，或將 PDF 拖曳至此處</div>
          <div class="file-drop-zone__hint">純本地解析處理，絕不上傳外部伺服器</div>
        </div>
      </div>

      <!-- 檔案基本資訊與分割設定 -->
      <div class="tool-section" id="split-options" style="display: none;">
        <div class="tool-section__title">PDF 資訊與分割選項</div>

        <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); margin-bottom: var(--space-lg); display: flex; flex-wrap: wrap; gap: var(--space-xl);">
          <div>
            <span style="font-size: 0.8125rem; color: var(--color-text-tertiary); display: block;">檔案名稱</span>
            <span id="pdf-info-name" style="font-weight: 700;">--</span>
          </div>
          <div>
            <span style="font-size: 0.8125rem; color: var(--color-text-tertiary); display: block;">總頁數</span>
            <span id="pdf-info-pages" style="font-weight: 700; color: var(--color-accent);">-- 頁</span>
          </div>
          <div>
            <span style="font-size: 0.8125rem; color: var(--color-text-tertiary); display: block;">檔案大小</span>
            <span id="pdf-info-size" style="font-weight: 700;">--</span>
          </div>
        </div>

        <!-- 模式切換 -->
        <div class="form-group">
          <label class="form-label">分割方式：</label>
          <div style="display: flex; gap: var(--space-md); flex-wrap: wrap;">
            <label class="form-checkbox">
              <input type="radio" name="split-mode" value="range" checked>
              <span>擷取指定頁碼範圍 (自訂新 PDF)</span>
            </label>
            <label class="form-checkbox">
              <input type="radio" name="split-mode" value="all">
              <span>拆解為單頁 PDF (打包為 ZIP)</span>
            </label>
          </div>
        </div>

        <!-- 範圍輸入區 -->
        <div id="range-wrapper" style="margin-top: var(--space-md);">
          <div class="form-group">
            <label class="form-label" for="page-range-input">請輸入要擷取的頁碼或範圍：</label>
            <input type="text" class="form-input" id="page-range-input" placeholder="例如：1-3, 5, 8-10">
            <span style="font-size: 0.8125rem; color: var(--color-text-tertiary); margin-top: 4px; display: block;">
              提示：使用逗號分隔各頁，連字號表示連續範圍。範例「1-3, 5」代表第 1、2、3、5 頁。
            </span>
          </div>
        </div>

        <div class="tool-actions" style="margin-top: var(--space-xl);">
          <button class="btn btn--primary btn--lg" id="btn-do-split" type="button">
            立即分割並下載
          </button>
          <button class="btn btn--secondary" id="btn-reupload" type="button">
            選擇其他 PDF
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/vendor/jszip.min.js"></script>
  <script src="../../js/vendor/pdf-lib.min.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
