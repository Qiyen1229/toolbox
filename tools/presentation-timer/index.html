<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>if(!location.pathname.endsWith("/")&&!location.pathname.endsWith(".html")){location.replace(location.pathname+"/"+location.search+location.hash);}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="演講與報告計時器 — 大字體投影、階段變色預警（綠→黃→橘→紅）、超時正計時與提示音。Qiyen Toolbox。">
  <title>報告計時器 (Presentation Timer) — Qiyen Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/tool-layout.css">
  <script src="../../js/theme.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="navbar__inner">
      <a href="../../index.html" class="navbar__logo">
        <div class="navbar__logo-icon">Q</div>
        <span>Qiyen Toolbox</span>
      </a>
      <div style="flex:1;"></div>
      <div class="navbar__actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切換深色/淺色模式"></button>
      </div>
    </div>
  </nav>

  <!-- 主內容 -->
  <main class="tool-page">
    <div class="tool-container">

      <!-- 麵包屑 -->
      <div class="breadcrumb">
        <a href="../../index.html">首頁</a>
        <span class="breadcrumb__separator">›</span>
        <span class="breadcrumb__current">報告計時器</span>
      </div>

      <!-- 工具標題 -->
      <header class="tool-header">
        <h1 class="tool-header__title">
          <div class="tool-header__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div class="tool-header__title-group">
            <span class="tool-header__title-zh">簡報與演講計時器</span>
            <span class="tool-header__title-en">Presentation Timer</span>
          </div>
        </h1>
        <p class="tool-header__description">專為課堂報告、黑客松與演講設計，支援超大字體、多段警示變色、超時追蹤與全螢幕投影。</p>
      </header>

      <!-- 時間設定列 -->
      <div class="tool-section" id="config-section">
        <div style="display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap;">
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="target-minutes">報告總長度 (分鐘)：</label>
            <input type="number" class="form-input" id="target-minutes" value="10" min="1" max="180" step="1" style="width: 120px; font-size: 1.125rem; font-weight: 700;">
          </div>

          <div style="display: flex; gap: 6px; align-self: flex-end;">
            <button class="btn btn--secondary btn-min-preset" data-m="3">3 分鐘</button>
            <button class="btn btn--secondary btn-min-preset" data-m="5">5 分鐘</button>
            <button class="btn btn--secondary btn-min-preset" data-m="10">10 分鐘</button>
            <button class="btn btn--secondary btn-min-preset" data-m="15">15 分鐘</button>
            <button class="btn btn--secondary btn-min-preset" data-m="20">20 分鐘</button>
          </div>
        </div>
      </div>

      <!-- 大字體計時看版 -->
      <div class="tool-section" id="timer-board" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-2xl) var(--space-md); background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-xl); text-align: center; transition: all 0.3s ease;">
        
        <div id="status-tag" style="font-size: 1rem; font-weight: 700; color: var(--color-success); margin-bottom: var(--space-md); padding: 4px 16px; border-radius: 20px; background: rgba(16, 185, 129, 0.1);">
          準備開始
        </div>

        <div id="big-timer-display" style="font-size: clamp(4rem, 12vw, 8rem); font-weight: 900; font-family: var(--font-mono, monospace); line-height: 1; color: var(--color-text-primary); letter-spacing: -0.02em; margin-bottom: var(--space-lg);">
          10:00
        </div>

        <!-- 按鈕控制組 -->
        <div style="display: flex; gap: var(--space-md); flex-wrap: wrap; justify-content: center;">
          <button class="btn btn--primary" id="btn-timer-toggle" style="padding: 12px 36px; font-size: 1.125rem;">開始計時</button>
          <button class="btn btn--secondary" id="btn-timer-reset" style="padding: 12px 24px;">重設</button>
          <button class="btn btn--ghost" id="btn-fullscreen" style="padding: 12px 20px;">⛶ 全螢幕看版</button>
        </div>

      </div>

    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Qiyen Toolbox · 開發者：Qiyen · 所有工具皆在瀏覽器本地執行</p>
  </footer>

  <script src="../../js/storage.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/tools-registry.js"></script>
  <script src="script.js"></script>
</body>
</html>
